# Grafana dashboards provisioning configuration

apiVersion: 1

providers:
  - name: 'sample-monitoring'
    orgId: 1
    folder: 'sample-monitoring'
    folderUid: 'sample-monitoring'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/dashboards
