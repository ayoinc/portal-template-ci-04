apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: sample-monitoring
  description: "The SRE team's \"eyes\" on production: monitoring for payments"
  annotations:
    backstage.io/techdocs-ref: dir:.
    github.com/project-slug: example-org/sample-monitoring
    prometheus.io/alert: sample-monitoring-alerts
    grafana/dashboard-selector: sample-monitoring
  tags:
    - monitoring
    - prometheus
    - grafana
    - application
  links:
    - url: "http://prometheus:9090"
